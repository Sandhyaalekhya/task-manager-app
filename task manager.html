<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 400px;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    input, select, button {
      width: calc(100% - 20px);
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background-color: #28a745;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #218838;
    }

    .task {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task.high { border-left: 5px solid #dc3545; }
    .task.medium { border-left: 5px solid #ffc107; }
    .task.low { border-left: 5px solid #17a2b8; }

    .task-actions {
      display: flex;
      gap: 5px;
    }

    .task-actions button {
      padding: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Task Manager</h2>
  
  <input type="text" id="taskTitle" placeholder="Task Title" />
  <input type="date" id="taskDate" />
  <select id="taskPriority">
    <option value="high">High Priority</option>
    <option value="medium">Medium Priority</option>
    <option value="low">Low Priority</option>
  </select>
  <button onclick="addTask()">Add Task</button>

  <div id="taskList"></div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
    displayTasks();
  }

  function addTask() {
    const title = document.getElementById('taskTitle').value.trim();
    const date = document.getElementById('taskDate').value;
    const priority = document.getElementById('taskPriority').value;

    if (!title || !date) {
      alert("Please fill in all fields");
      return;
    }

    tasks.push({ title, date, priority });
    saveTasks();

    // Clear input fields
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDate').value = '';
    document.getElementById('taskPriority').value = 'medium';
  }

  function editTask(index) {
    const task = tasks[index];
    const newTitle = prompt("Edit Task Title:", task.title);
    const newDate = prompt("Edit Task Date:", task.date);
    const newPriority = prompt("Edit Priority (high, medium, low):", task.priority);

    if (newTitle && newDate && newPriority) {
      tasks[index] = { title: newTitle, date: newDate, priority: newPriority };
      saveTasks();
    }
  }

  function deleteTask(index) {
    if (confirm("Are you sure you want to delete this task?")) {
      tasks.splice(index, 1);
      saveTasks();
    }
  }

  function postponeTask(index) {
    const newDate = prompt("Enter new date (YYYY-MM-DD):");
    if (newDate) {
      tasks[index].date = newDate;
      saveTasks();
    }
  }

  function displayTasks() {
    const taskList = document.getElementById('taskList');
    taskList.innerHTML = '';

    tasks.sort((a, b) => {
      if (a.date !== b.date) {
        return new Date(a.date) - new Date(b.date);
      }
      const priorityOrder = { high: 1, medium: 2, low: 3 };
      return priorityOrder[a.priority] - priorityOrder[b.priority];
    });

    tasks.forEach((task, index) => {
      const taskDiv = document.createElement('div');
      taskDiv.classList.add('task', task.priority);

      taskDiv.innerHTML = `
        <div>
          <strong>${task.title}</strong> <br>
          <small>${task.date}</small>
        </div>
        <div class="task-actions">
          <button onclick="editTask(${index})">Edit</button>
          <button onclick="deleteTask(${index})">Delete</button>
          <button onclick="postponeTask(${index})">Postpone</button>
        </div>
      `;

      taskList.appendChild(taskDiv);
    });
  }

  window.onload = displayTasks;
</script>

</body>
</html>
